<!doctype html>
<html lang="pt-BR" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Arthur Martins é estudante de Engenharia de Software com foco em Java e Spring Boot e experiência profissional em React e TypeScript. Conheça seus projetos e entre em contato." />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="pt_BR" />
    <meta property="og:title" content="Arthur Martins | Engenharia de Software" />
    <meta property="og:description" content="Projetos em Java, Spring Boot, React e TypeScript. Conheça o trabalho de Arthur Martins." />
    <meta property="og:image" content="/portfolio-preview.jpg" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Arthur Martins | Engenharia de Software" />
    <meta name="twitter:description" content="Projetos em Java, Spring Boot, React e TypeScript. Conheça o trabalho de Arthur Martins." />
    <meta name="twitter:image" content="/portfolio-preview.jpg" />
    <script>
      (() => {
        let theme = 'light'
        try {
          const savedTheme = localStorage.getItem('portfolio-theme')
          if (savedTheme === 'light' || savedTheme === 'dark') theme = savedTheme
        } catch {
          // Keep the light default when browser storage is unavailable.
        }

        document.documentElement.dataset.theme = theme
        document.documentElement.style.colorScheme = theme
      })()
    </script>
    <title>Arthur Martins | Engenharia de Software</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
